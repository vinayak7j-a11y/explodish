<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Explodish Ops</title>
<style>
  body{margin:0;background:#120c08;color:#f3e7d3;font:15px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;}
  .wrap{max-width:720px;margin:0 auto;padding:16px;}
  h1{font-size:20px;margin:0;}
  h2{font-size:15px;margin:18px 0 8px;}
  .bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;}
  .btn{background:#f5a623;color:#2a1b08;border:0;border-radius:10px;padding:10px 14px;font-weight:700;font-size:14px;cursor:pointer;text-decoration:none;display:inline-block;}
  .btn.sec{background:#2a2018;color:#f3e7d3;border:1px solid #3b2d22;}
  .btn.on{background:#f5a623;color:#2a1b08;}
  .btn:disabled{opacity:.4;cursor:default;}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
  .chip{background:#2a2018;color:#f3e7d3;border:1px solid #3b2d22;border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;}
  .chip.on{background:#f5a623;color:#2a1b08;border-color:#f5a623;font-weight:700;}
  .card{background:#1d1510;border:1px solid #3b2d22;border-radius:12px;padding:12px;margin-bottom:10px;}
  .card.tap{cursor:pointer;}
  .top{display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .name{font-weight:700;font-size:16px;}
  .badge{font-size:11px;font-weight:700;border-radius:999px;padding:2px 9px;text-transform:uppercase;white-space:nowrap;}
  .s-waiting{background:#5a2d12;color:#ffb27a;}
  .s-building{background:#4a3b0c;color:#ffd866;}
  .s-preview{background:#0f3a4a;color:#7fd6f5;}
  .s-live{background:#12401f;color:#8fe0a0;}
  .s-expired{background:#3a3a3a;color:#bbb;}
  .muted{opacity:.7;font-size:13px;}
  .err{color:#ff9d8a;margin:8px 0;}
  input{background:#241a13;color:inherit;border:1px solid #3b2d22;border-radius:8px;padding:10px;font-size:15px;width:100%;box-sizing:border-box;}
  .row{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0;align-items:center;}
  .row input{width:auto;flex:1;min-width:140px;}
  .files{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;}
  .files img{width:100%;height:110px;object-fit:cover;border-radius:8px;border:1px solid #3b2d22;display:block;}
  .pdf{display:flex;align-items:center;justify-content:center;height:110px;border-radius:8px;border:1px solid #3b2d22;background:#241a13;color:#f3e7d3;text-decoration:none;font-weight:700;}
  a{color:#f5a623;}
</style>
</head>
<body>
<div class="wrap" id="root"></div>
<script src="/ops.js"></script>
</body>
</html>
