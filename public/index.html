<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Explodish — Interactive Menu</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="shell">
  <div class="masthead" id="masthead">
    <div class="mark">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 3L21 8L12 13L3 8L12 3Z" stroke="#2A1B08" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M3 12L12 17L21 12" stroke="#2A1B08" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M3 16L12 21L21 16" stroke="#2A1B08" stroke-width="1.6" stroke-linejoin="round"/>
      </svg>
    </div>
    <div>
      <h1 id="mastheadTitle">Explodish</h1>
      <div class="tag" id="mastheadTag">Open a dish. See inside it. Build it your way.</div>
    </div>
  </div>

  <div class="tabs" id="tabs" style="display:none;"></div>

  <div class="panel" id="panel">
    <div class="boot-loader" role="status" aria-label="Loading">
      <div class="boot-mark">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 3L21 8L12 13L3 8L12 3Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
          <path d="M3 12L12 17L21 12" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
          <path d="M3 16L12 21L21 16" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
        </svg>
      </div>
    </div>
  </div>
</div>

<button class="cart-fab" id="cartFab" style="display:none;"></button>
<div class="cart-panel" id="cartPanel" style="display:none;"></div>

<script src="app.js"></script>
</body>
</html>
